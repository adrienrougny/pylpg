[project]
name = "pylpg"
dynamic = ["version"]
description = "A Python Object Graph Mapper for labeled property graph databases"
authors = [{ name = "Adrien Rougny", email = "adrienrougny@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/rougny/pylpg"
Issues = "https://github.com/rougny/pylpg/issues"

[project.optional-dependencies]
neo4j = ["neo4j>=5.0"]
falkordb = ["falkordb>=1.0"]
falkordblite = ["falkordblite>=0.1; python_version>='3.12'"]
all = ["pylpg[neo4j,falkordb]"]

[dependency-groups]
dev = [
    "ruff>=0.11",
    "mkdocs-material>=9.6",
    "mkdocstrings-python>=1.16",
    "griffe-fieldz>=0.1",
    "griffe-inherited-docstrings>=1.1",
    { include-group = "test" },
]
test = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "testcontainers[neo4j]>=4.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
tag_regex = '^v(?P<version>([0-9].*))'

[tool.hatch.build.targets.wheel]
packages = ["src/pylpg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/pylpg"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
